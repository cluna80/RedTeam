[nodes]
rpc_urls = [
    "http://127.0.0.1:8080",
    "http://127.0.0.1:8081",
    "http://127.0.0.1:8082",
]
api_urls = [
    "http://127.0.0.1:8080",
    "http://127.0.0.1:8081",
    "http://127.0.0.1:8082",
]

[scheduler]
url = "http://127.0.0.1:8080"

[identity]
url = "http://127.0.0.1:8080"

[accounts]
alice  = "qcb1alice"
bob    = "qcb1bob"
carol  = "qcb1carol"
dave   = "qcb1dave"
faucet = "qcb1alice"

[timing]
poll_interval_secs     = 5
finding_flush_interval = 30
gossip_replay_window   = 120

[limits]
max_flood_msgs       = 500
max_sybil_identities = 20

# DIS vendor server — separate service from the blockchain nodes.
# Set vendor_url to wherever dis-vendor-server is listening.
# I9/I10/I11/I12 tests are NOT_TESTED when this section is absent.
[dis]
vendor_url = "http://127.0.0.1:3000"
vendor_id  = "devnet"
