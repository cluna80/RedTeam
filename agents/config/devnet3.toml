# agents/config/devnet3.toml
# 3-node devnet: Alice / Bob / Carol
# Matches ports used in existing devnet genesis scripts.

[nodes]
rpc_urls = [
    "http://127.0.0.1:26657",   # Alice
    "http://127.0.0.1:26659",   # Bob
    "http://127.0.0.1:26661",   # Carol
]
api_urls = [
    "http://127.0.0.1:1317",    # Alice REST
    "http://127.0.0.1:1318",    # Bob REST
    "http://127.0.0.1:1319",    # Carol REST
]

[scheduler]
url = "http://127.0.0.1:8080"

[identity]
url = "http://127.0.0.1:9090"

[accounts]
alice   = "qcb1alice000000000000000000000000000000000"
bob     = "qcb1bob00000000000000000000000000000000000"
carol   = "qcb1carol0000000000000000000000000000000000"
faucet  = "qcb1faucet000000000000000000000000000000000"

[timing]
poll_interval_secs      = 5
finding_flush_interval  = 30
gossip_replay_window    = 120   # seconds; stale threshold in Change Set R/S

[limits]
max_flood_msgs          = 500
max_sybil_identities    = 20
